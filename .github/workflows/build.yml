name: Build Desktop Apps
on:
  push:
    # main publishes the rolling build; the arena branch does too, so a branch build can be
    # installed straight from the release without merging the pull request.
    branches: ['main', 'arena/01a102e1-film-lab']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tag builds are unsigned; skip certificate discovery so electron-builder
      # never fails looking for a signing identity that CI does not have.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: film-lab-${{ matrix.os }}
          path: dist-electron/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Stage web assets
        run: npm run web:stage
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: film-lab-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish Release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Film Lab ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Film Lab installers for every platform:

            - **Windows:** download the `.exe` installer
            - **Mac:** download the `.dmg` disk image
            - **Linux:** download the `.AppImage`
            - **Android:** download the `.apk` package
          # Only the installers: `artifacts/*/*` skips the unpacked builds
          # (e.g. `win-unpacked/Film Lab.exe`) that electron-builder leaves behind.
          files: |
            artifacts/*/*.exe
            artifacts/*/*.dmg
            artifacts/*/*.AppImage
            artifacts/*/*.apk

      - name: Record the build identity
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a102e1-film-lab'
        run: |
          echo "SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
      # electron-builder stamps the version into its file names (`Film Lab Setup 1.0.5.exe`), which
      # would change every download link on a version bump. The rolling release therefore publishes
      # fixed names: the links below stay valid across builds.
      - name: Collect installers under stable names
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a102e1-film-lab'
        run: |
          mkdir -p release
          shopt -s nullglob
          for file in artifacts/*/*.exe; do cp "$file" release/FilmLab-Setup.exe; done
          for file in artifacts/*/*.dmg; do cp "$file" release/FilmLab.dmg; done
          for file in artifacts/*/*.AppImage; do cp "$file" release/FilmLab.AppImage; done
          for file in artifacts/*/*.apk; do cp "$file" release/FilmLab.apk; done
          ls -l release
      - name: Reset rolling latest-build release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a102e1-film-lab'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete latest-build --cleanup-tag --yes || true
      - name: Publish rolling latest-build release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a102e1-film-lab'
        uses: softprops/action-gh-release@v1
        with:
          name: latest-build
          tag_name: latest-build
          target_commitish: ${{ github.sha }}
          body: |
            Rolling Film Lab build from `${{ github.ref_name }}` at commit `${{ env.SHORT_SHA }}` (built ${{ env.BUILD_DATE }}).

            - **Windows:** `FilmLab-Setup.exe`
            - **Mac:** `FilmLab.dmg`
            - **Linux:** `FilmLab.AppImage`
            - **Android:** `FilmLab.apk`
          files: release/*
