name: Build Desktop Apps
on:
  push:
    # main publishes the rolling build; the arena branch does too, so a branch build can be
    # installed straight from the release without merging the pull request.
    branches: ['main', 'arena/01a102e1-film-lab']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
          - os: ubuntu-latest
            target: linux
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tag builds are unsigned; skip certificate discovery so electron-builder
      # never fails looking for a signing identity that CI does not have.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build:${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: film-lab-${{ matrix.os }}
          path: dist-electron/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Stage web assets
        run: npm run web:stage
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: film-lab-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish Release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Film Lab ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Film Lab installers for every platform:

            - **Windows:** download the `.exe` installer
            - **Mac:** download the `.dmg` disk image
            - **Linux:** download the `.AppImage`
            - **Android:** download the `.apk` package
          # Only the installers: `artifacts/*/*` skips the unpacked builds
          # (e.g. `win-unpacked/Film Lab.exe`) that electron-builder leaves behind.
          files: |
            artifacts/*/*.exe
            artifacts/*/*.dmg
            artifacts/*/*.AppImage
            artifacts/*/*.apk

      - name: Record the build identity
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a102e1-film-lab'
        run: |
          echo "SHORT_SHA=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_ENV"
          # The installers carry this version, so read it from package.json instead of hard-coding
          # it: the release name and notes then follow a version bump on their own.
          version=$(node -p 'require("./package.json").version' 2>/dev/null || true)
          if [ -z "$version" ]; then
            version=$(sed -n 's/^[[:space:]]*"version": "\([^"]*\)".*$/\1/p' package.json | head -n 1)
          fi
          if [ -z "$version" ]; then
            echo "could not read the app version from package.json" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "app version: $version"
      # electron-builder stamps the version into its file names (`Film Lab Setup 2.0.0.exe`), which
      # would change every download link on a version bump. The rolling release therefore publishes
      # fixed names: the links below stay valid across builds.
      - name: Collect installers under stable names
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a102e1-film-lab'
        run: |
          mkdir -p release
          shopt -s nullglob
          # Echo each source name: electron-builder stamps the app version into it
          # (`Film Lab Setup 2.0.0.exe`), which is the version the installed app reports.
          for file in artifacts/*/*.exe; do echo "packaging $file -> FilmLab-Setup.exe"; cp "$file" release/FilmLab-Setup.exe; done
          for file in artifacts/*/*.dmg; do echo "packaging $file -> FilmLab.dmg"; cp "$file" release/FilmLab.dmg; done
          for file in artifacts/*/*.AppImage; do echo "packaging $file -> FilmLab.AppImage"; cp "$file" release/FilmLab.AppImage; done
          for file in artifacts/*/*.apk; do echo "packaging $file -> FilmLab.apk"; cp "$file" release/FilmLab.apk; done
          ls -l release
      - name: Reset rolling latest-build release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a102e1-film-lab'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pass --repo explicitly: `gh` otherwise resolves the repository by shelling out to git,
          # which fails outright in a job without a checkout.
          if gh release delete latest-build --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"; then
            echo "deleted the latest-build release and its tag"
          else
            # No release yet, or the release could not be deleted: clear the assets it does have
            # so this run's upload cannot collide with a previous build's files.
            echo "release delete did not go through; clearing its assets instead"
            for asset in $(gh release view latest-build --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null); do
              echo "removing stale asset: $asset"
              gh release delete-asset latest-build "$asset" --yes --repo "$GITHUB_REPOSITORY"
            done
          fi
      - name: Publish rolling latest-build release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/arena/01a102e1-film-lab'
        uses: softprops/action-gh-release@v1
        with:
          # The tag stays `latest-build` so the download links never change; the title carries the
          # app version that was just built, read from package.json above.
          name: latest-build v${{ env.APP_VERSION }}
          tag_name: latest-build
          target_commitish: ${{ github.sha }}
          body: |
            Rolling **Film Lab v${{ env.APP_VERSION }}** build from `${{ github.ref_name }}` at commit `${{ env.SHORT_SHA }}` (built ${{ env.BUILD_DATE }}).

            The installers carry this version in their own names (for example `Film Lab Setup ${{ env.APP_VERSION }}.exe`),
            but they are published here under fixed names, so these download links stay valid between versions:

            - **Windows:** `FilmLab-Setup.exe`
            - **Mac:** `FilmLab.dmg`
            - **Linux:** `FilmLab.AppImage`
            - **Android:** `FilmLab.apk`
          files: release/*
